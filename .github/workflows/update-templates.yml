name: Update Marketplace Templates

on:
  schedule:
    # Run daily at 08:00 UTC (16:00 Beijing time)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check and update templates
        run: node .github/scripts/check-templates.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add templates.json
          git diff --staged --quiet || git commit -m "chore: update marketplace templates [skip ci]"
          git push
